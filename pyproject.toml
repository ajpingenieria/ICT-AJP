[project]
name = "ict-ajp"
version = "0.1.0"
description = "Cálculo y generación de proyectos de Infraestructura Común de Telecomunicaciones (RD 346/2011)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "openpyxl>=3.1", "ezdxf>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ict-ajp = "ict_ajp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ict_ajp*"]
